    /* 3D Flip Card Styles */
    .perspective-1000 {
      perspective: 1000px;
    }

    .transform-style-3d {

    }

    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    .flip-card:hover .flip-card-inner,
    .flip-card:focus-within .flip-card-inner,
    .flip-card.is-flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    /* Scroll Entrance Transition */
    .reveal-item {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }

    .reveal-item.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .stagger-1 { transition-delay: 80ms; }
    .stagger-2 { transition-delay: 160ms; }
    .stagger-3 { transition-delay: 240ms; }
    .stagger-4 { transition-delay: 320ms; }

    @media (prefers-reduced-motion: reduce) {
      .reveal-item {
        opacity: 1 !important;
        transform: none !important;
        transition: none !important;
      }
    }

    /* Navbar Link Hover Indicator */
    .nav-link {
      position: relative;
      transition: color 200ms ease, background-color 200ms ease;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      width: 0;
      height: 2px;
      background-color: #196716;
      border-radius: 9999px;
      transition: width 220ms ease, left 220ms ease;
    }

    .nav-link:hover::after,
    .nav-link.is-active::after {
      width: 80%;
      left: 10%;
    }

    /* 3D Digital Journal Carousel (Pinterest Inspired) */
    .journal-stage {
      perspective: 1200px;
      transform-style: preserve-3d;
    }

    .journal-card {
      position: absolute;
      width: min(520px, 86vw);
      height: 330px;
      transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.45s ease, filter 0.45s ease;
      transform-style: preserve-3d;
      will-change: transform, opacity;
      user-select: none;
      -webkit-user-select: none;
    }

    .journal-card .journal-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 1.5rem;
      transition: transform 0.65s cubic-bezier(0.2, 0.8, 0.2, 1);
      will-change: transform;
    }

    .journal-card.is-active-center {
      cursor: default;
    }

    /* Universal Hover to Zoom Effect for Center, Next, and Previous Images */
    .journal-card:hover .journal-img,
    .journal-card.is-hover-zoomed .journal-img {
      transform: scale(1.10);
    }

    .journal-card.is-nav-prev,
    .journal-card.is-nav-next {
      cursor: pointer;
    }

    .journal-card.is-nav-prev:hover,
    .journal-card.is-nav-next:hover,
    .journal-card.is-nav-prev.is-hover-zoomed,
    .journal-card.is-nav-next.is-hover-zoomed {
      z-index: 35 !important;
      filter: brightness(1.08) drop-shadow(0 25px 35px rgba(0, 0, 0, 0.65)) !important;
    }

    /* 3D Fan-In Entry Transition */
    .journal-card.is-entering {
      transition: transform 1.1s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.95s ease, filter 0.95s ease !important;
    }

    @media (min-width: 640px) {
      .journal-card {
        height: 410px;
        width: 580px;
      }
    }

    @media (min-width: 1024px) {
      .journal-card {
        height: 470px;
        width: 660px;
      }
    }

    .fade-content {
      animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>

    /* ================= COMPONENT: Performance ================= */
    function Performance() {
      const [statsAnimated, setStatsAnimated] = useState(false);
      const [counters, setCounters] = useState({
        founded: 0,
        students: 0,
        staff: 0,
        olPass: 0,
        alQual: 0,
        clubs: 0,
        houses: 0,
        labs: 0
      });

      const sectionRef = useRef(null);

      useEffect(() => {
        if (!sectionRef.current) return;
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting && !statsAnimated) {
              setStatsAnimated(true);
              const duration = 2000;
              const targets = { founded: 1852, students: 386, staff: 46, olPass: 94.2, alQual: 78, clubs: 18, houses: 4, labs: 100 };
              let startTime = null;

              function step(timestamp) {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / duration, 1);
                const ease = easeOutExpo(progress);

                setCounters({
                  founded: Math.floor(ease * targets.founded),
                  students: Math.floor(ease * targets.students),
                  staff: Math.floor(ease * targets.staff),
                  olPass: (ease * targets.olPass).toFixed(1),
                  alQual: Math.floor(ease * targets.alQual),
                  clubs: Math.floor(ease * targets.clubs),
                  houses: Math.floor(ease * targets.houses),
                  labs: Math.floor(ease * targets.labs)
                });

                if (progress < 1) requestAnimationFrame(step);
                else {
                  setCounters({
                    founded: targets.founded,
                    students: targets.students,
                    staff: targets.staff,
                    olPass: targets.olPass.toFixed(1),
                    alQual: targets.alQual,
                    clubs: targets.clubs,
                    houses: targets.houses,
                    labs: targets.labs
                  });
                }
              }
              requestAnimationFrame(step);
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.2 });

        observer.observe(sectionRef.current);
        return () => observer.disconnect();
      }, [statsAnimated]);

      return (
        <section ref={sectionRef} className="py-16 bg-brand-white border-b border-brand-pale" id="performance">
          <div className="max-w-9xl mx-auto px-4 sm:px-6 lg:px-8">

              <p className="text-slate-600 text-sm mt-2">

            </div>

            <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
              <div className="p-6 rounded-2xl bg-brand-light border border-brand-pale text-center reveal-item is-visible stagger-1 transition-all duration-200 hover:border-brand-soft hover:-translate-y-1">
                <p className="text-3xl lg:text-4xl font-extrabold text-brand-forest font-sans">{counters.founded}</p>
                <p className="text-xs uppercase font-bold text-brand-sage mt-2">Founded Year</p>

              </div>

              <div className="p-6 rounded-2xl bg-brand-light border border-brand-pale text-center reveal-item is-visible stagger-2 transition-all duration-200 hover:border-brand-soft hover:-translate-y-1">

    /* ================= COMPONENT: Gallery (3D Carousel) ================= */
    function Gallery() {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [hasEntered, setHasEntered] = useState(false);
      const [isEntering, setIsEntering] = useState(false);
      const [hoveredSide, setHoveredSide] = useState(null);

      const stageRef = useRef(null);
      const sectionRef = useRef(null);
      const autoRotateRef = useRef(null);
      const total = journalGallery.length;

      const startAutoRotate = useCallback(() => {
        if (autoRotateRef.current) clearInterval(autoRotateRef.current);
        autoRotateRef.current = setInterval(() => {
          setCurrentIndex(prev => (prev + 1) % total);
        }, 3500);
      }, [total]);

      const stopAutoRotate = useCallback(() => {
        if (autoRotateRef.current) {
          clearInterval(autoRotateRef.current);
          autoRotateRef.current = null;
        }
      }, []);

      const focusIndex = useCallback((targetIndex) => {
        if (!hasEntered) {
          setHasEntered(true);
          setIsEntering(false);
        }
        const safeIndex = (targetIndex % total + total) % total;
        setCurrentIndex(safeIndex);
        startAutoRotate();
      }, [hasEntered, total, startAutoRotate]);

      useEffect(() => {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting && !hasEntered) {
              setHasEntered(true);
              setIsEntering(true);
              startAutoRotate();
              setTimeout(() => setIsEntering(false), 1100);
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.12 });

        if (sectionRef.current) observer.observe(sectionRef.current);

        const timer = setTimeout(() => {
          if (!hasEntered) {
            setHasEntered(true);
            setIsEntering(true);
            startAutoRotate();
            setTimeout(() => setIsEntering(false), 1100);
          }
        }, 1200);

        return () => {
          observer.disconnect();
          clearTimeout(timer);
          stopAutoRotate();
        };
      }, [hasEntered, startAutoRotate, stopAutoRotate]);

      const handleStageMouseMove = (e) => {
        if (!stageRef.current) return;
        const stageRect = stageRef.current.getBoundingClientRect();
        const centerX = stageRect.left + stageRect.width / 2;
        const mouseX = e.clientX;
        const cardHalfWidth = 260;

        if (mouseX < centerX - cardHalfWidth + 50) setHoveredSide('prev');
        else if (mouseX > centerX + cardHalfWidth - 50) setHoveredSide('next');
        else setHoveredSide(null);
      };

      const handleStageClick = (e) => {
        if (!stageRef.current) return;
        const stageRect = stageRef.current.getBoundingClientRect();
        const centerX = stageRect.left + stageRect.width / 2;
        const clickX = e.clientX;
        const cardHalfWidth = 260;

        if (clickX < centerX - cardHalfWidth + 50) focusIndex(currentIndex - 1);
        else if (clickX > centerX + cardHalfWidth - 50) focusIndex(currentIndex + 1);
      };

      return (
        <section
          ref={sectionRef}
          className="py-16 sm:py-24 bg-[#0a1c11] text-brand-white relative overflow-hidden select-none border-t border-b border-brand-forest/40"
          id="gallery"
        >
          <div className="absolute inset-0 pointer-events-none overflow-hidden">
            <div className="absolute -top-32 left-1/2 -translate-x-1/2 w-[700px] h-[350px] bg-brand-forest/25 rounded-full blur-[120px]" />
            <div className="absolute -bottom-24 left-1/2 -translate-x-1/2 w-[900px] h-[250px] bg-brand-forest/20 rounded-full blur-[100px]" />
          </div>

          <div className="max-w-9xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
            <div className="text-center pb-2 mb-6 reveal-item is-visible">
              <h2 className="text-2xl sm:text-3xl lg:text-4xl font-extrabold text-white tracking-tight leading-tight">
                Campus Life Gallery
              </h2>
              <div className="flex items-center justify-center gap-2 mt-1.5 text-xs text-brand-pale">
                <span className="font-tamil">கல்லூரி நினைவுகள் & புகைப்படத் தொகுப்பு</span>
                <span>•</span>
                <span className="inline-flex items-center gap-1 bg-white/10 px-2.5 py-0.5 rounded-full text-[11px] font-mono text-white">
                  11 Moments
                </span>
              </div>
            </div>

            <div className="relative w-full py-4 sm:py-6 flex flex-col items-center justify-center">
              <div
                ref={stageRef}
                onClick={handleStageClick}
                onMouseMove={handleStageMouseMove}
                onMouseLeave={() => setHoveredSide(null)}
                className="journal-stage relative w-full max-w-6xl h-[360px] sm:h-[450px] lg:h-[520px] flex items-center justify-center cursor-pointer"
              >
                {journalGallery.map((item, index) => {
                  let offset = index - currentIndex;
                  if (offset > Math.floor(total / 2)) offset -= total;
                  if (offset < -Math.floor(total / 2)) offset += total;
                  const absOffset = Math.abs(offset);

                  let style = {};
                  let extraClasses = '';

                  if (!hasEntered) {
                    const dir = offset > 0 ? 1 : (offset < 0 ? -1 : 0);
                    style = offset === 0
                      ? { transform: 'translateX(0) scale(0.85) rotateY(0deg) translateZ(-60px)', opacity: 0, zIndex: 30 }
                      : { transform: `translateX(${dir * 18}%) scale(0.65) rotateY(${dir * -12}deg) translateZ(-140px)`, opacity: 0, zIndex: 10 };
                  } else {
                    if (offset === 0) {
                      extraClasses += ' is-active-center';
                      style = { transform: 'translateX(0) scale(1) rotateY(0deg) translateZ(0)', zIndex: 30, opacity: 1, filter: 'none', pointerEvents: 'auto', cursor: 'default' };
                    } else if (absOffset === 1) {
                      const dir = offset > 0 ? 1 : -1;
                      const isNavNext = dir > 0;
                      extraClasses += isNavNext ? ' is-nav-next' : ' is-nav-prev';
                      if ((isNavNext && hoveredSide === 'next') || (!isNavNext && hoveredSide === 'prev')) {
                        extraClasses += ' is-hover-zoomed';
                      }
                      const isMobile = window.innerWidth < 640;
                      const tx = isMobile ? dir * 48 : dir * 64;
                      const rotY = dir * -25;
                      style = { transform: `translateX(${tx}%) scale(0.85) rotateY(${rotY}deg) translateZ(-80px)`, zIndex: 20, opacity: 0.85, filter: 'brightness(0.85)', pointerEvents: 'auto', cursor: 'pointer' };
                    } else if (absOffset === 2) {
                      const dir = offset > 0 ? 1 : -1;
                      extraClasses += dir > 0 ? ' is-nav-next' : ' is-nav-prev';
                      const isMobile = window.innerWidth < 640;
                      const tx = isMobile ? dir * 80 : dir * 110;
                      const rotY = dir * -38;
                      style = { transform: `translateX(${tx}%) scale(0.70) rotateY(${rotY}deg) translateZ(-160px)`, zIndex: 15, opacity: isMobile ? 0 : 0.55, filter: 'brightness(0.7)', pointerEvents: isMobile ? 'none' : 'auto', cursor: 'pointer' };
                    } else if (absOffset === 3) {
                      const dir = offset > 0 ? 1 : -1;
                      extraClasses += dir > 0 ? ' is-nav-next' : ' is-nav-prev';
                      const isMobile = window.innerWidth < 640;
                      const tx = isMobile ? dir * 95 : dir * 150;
                      const rotY = dir * -48;
                      style = { transform: `translateX(${tx}%) scale(0.58) rotateY(${rotY}deg) translateZ(-240px)`, zIndex: 10, opacity: isMobile ? 0 : 0.25, filter: 'brightness(0.55)', pointerEvents: isMobile ? 'none' : 'auto', cursor: 'pointer' };
                    } else {
                      const dir = offset > 0 ? 1 : -1;
                      style = { transform: `translateX(${dir * 180}%) scale(0.4) rotateY(${dir * -60}deg) translateZ(-350px)`, zIndex: 1, opacity: 0, pointerEvents: 'none', cursor: 'default' };
                    }
                  }

                  if (isEntering) extraClasses += ' is-entering';

                  return (
                    <div
                      key={index}
                      onClick={(e) => {
                        e.stopPropagation();
                        focusIndex(index);
                      }}
                      style={style}
                      className={`journal-card rounded-3xl overflow-hidden shadow-2xl border-2 border-white/20 bg-slate-900 group ${extraClasses}`}
                      title={offset === 0 ? `Current image (${index + 1} of ${total})` : 'Click to focus this image'}
                    >
                      <div className="relative w-full h-full overflow-hidden rounded-3xl">
                        <img src={item.src} alt={`Campus Gallery Photo ${index + 1}`} className="journal-img" loading="lazy" />
                      </div>
                    </div>
                  );
                })}
              </div>

              <div className="w-[85%] max-w-4xl h-10 mx-auto -mt-6 bg-black/60 rounded-full blur-2xl pointer-events-none" />

              <div className="mt-8 flex items-center justify-center gap-2 flex-wrap max-w-md mx-auto">
                {journalGallery.map((_, i) => (
                  <button
                    key={i}
                    type="button"
                    onClick={() => focusIndex(i)}
                    title={`Moment ${i + 1} of ${total}`}
                    aria-label={`Go to image ${i + 1}`}
                    className={`h-2.5 rounded-full transition-all duration-300 cursor-pointer ${
                      i === currentIndex ? 'bg-white w-8 shadow-md' : 'bg-white/35 hover:bg-white/70 w-2.5'
                    }`}
                  />
                ))}
              </div>
            </div>
          </div>
        </section>
      );
    }

      });

      useEffect(() => {
        if (isOpen) {

                  className="p-2.5 rounded-xl bg-brand-light border border-brand-pale text-brand-forest cursor-pointer"
                >
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    {mobileMenuOpen ? (
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                    ) : (
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                    )}
                  </svg>
                </button>
              </div>
            </nav>
          </div>

          {/* Mobile Drawer */}
          {mobileMenuOpen && (
            <div className="md:hidden bg-brand-white border-t border-brand-pale px-6 py-4 space-y-3 shadow-lg">
              <button
                type="button"
                onClick={() => { setMobileMenuOpen(false); onOpenSearch(); }}
                className="w-full flex items-center justify-between bg-brand-light border border-brand-pale px-4 py-2.5 rounded-xl text-xs text-slate-600 font-medium"
              >
                <span className="flex items-center gap-2">
                  <svg className="w-4 h-4 text-brand-forest" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                  <span>Search KCC portal...</span>
                </span>
                <kbd className="text-[10px] bg-brand-white px-2 py-0.5 rounded border border-brand-pale text-slate-400 font-mono">Ctrl+K</kbd>
              </button>

              {currentPage === 'home' ? (
                <React.Fragment>
                  <button type="button" onClick={() => handleLink('history')} className="block w-full text-left text-slate-700 hover:text-brand-forest font-medium py-2 rounded-lg hover:bg-brand-light px-3">
                    History
                  </button>
                  <button type="button" onClick={() => handleLink('home', '#gallery')} className="block w-full text-left text-slate-700 hover:text-brand-forest font-medium py-2 rounded-lg hover:bg-brand-light px-3">
                    Gallery
                  </button>
                  <button type="button" onClick={() => handleLink('home', '#principles')} className="block w-full text-left text-slate-700 hover:text-brand-forest font-medium py-2 rounded-lg hover:bg-brand-light px-3">
                    Academics
                  </button>
                  <button type="button" onClick={() => handleLink('home', '#performance')} className="block w-full text-left text-slate-700 hover:text-brand-forest font-medium py-2 rounded-lg hover:bg-brand-light px-3">
                    Performance
                  </button>
                  <button type="button" onClick={() => handleLink('home', '#contact')} className="block w-full text-center bg-brand-forest hover:bg-brand-forestHover text-brand-white py-2.5 rounded-full font-medium">
                    Contact Us
                  </button>
                </React.Fragment>
              ) : (
                <React.Fragment>
                  <button type="button" onClick={() => handleLink('home')} className="block w-full text-left text-brand-forest font-semibold py-2 rounded-lg hover:bg-brand-light px-3">
                    ← Back to Home
                  </button>
                  <div className="flex items-center gap-2 pt-2 border-t border-brand-pale">
                    <span className="text-xs text-slate-500 font-medium">Language:</span>
                    <button type="button" onClick={() => onChangeHistoryLang('en')} className={`px-3 py-1 rounded-full text-xs font-semibold ${historyLang === 'en' ? 'bg-brand-forest text-white' : 'bg-brand-light text-slate-700'}`}>
                      English
                    </button>
                    <button type="button" onClick={() => onChangeHistoryLang('ta')} className={`px-3 py-1 rounded-full text-xs font-semibold font-tamil ${historyLang === 'ta' ? 'bg-brand-forest text-white' : 'bg-brand-light text-slate-700'}`}>
                      தமிழ்
                    </button>
                  </div>
                </React.Fragment>
              )}
            </div>
          )}
        </header>
      );
    }

    /* ================= COMPONENT: Footer ================= */
    function Footer({ onNavigate, onOpenAnthem }) {
      return (
        <footer className="bg-brand-white border-t border-brand-pale py-6 text-xs text-slate-500">
          <div className="max-w-9xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div className="font-semibold text-brand-forest">
              J/Kopay Christian College
            </div>
            <div className="flex items-center gap-4 flex-wrap justify-center">
              <button type="button" onClick={onOpenAnthem} className="hover:text-brand-forest font-tamil transition-colors cursor-pointer">
                பாடசாலைக் கீதம்
              </button>
              <button type="button" onClick={() => onNavigate('history')} className="hover:text-brand-forest transition-colors cursor-pointer">
                History
              </button>
              <button type="button" onClick={() => onNavigate('home', '#principles')} className="hover:text-brand-forest transition-colors cursor-pointer">
                Academics
              </button>
              <button type="button" onClick={() => onNavigate('home', '#performance')} className="hover:text-brand-forest transition-colors cursor-pointer">
                Performance
              </button>
              <button type="button" onClick={() => onNavigate('home', '#contact')} className="hover:text-brand-forest transition-colors cursor-pointer">
                Contact
              </button>
            </div>
            <div>
              &copy; 2026 J/Kopay Christian College. All rights reserved.
            </div>
          </div>
        </footer>
      );
    }

    /* ================= ROOT APPLICATION ================= */
    function App() {
      const [currentPage, setCurrentPage] = useState('home');
      const [historyLang, setHistoryLang] = useState('en');
      const [isSearchOpen, setIsSearchOpen] = useState(false);
      const [isAnthemOpen, setIsAnthemOpen] = useState(false);

      useEffect(() => {
        function handleHash() {
          const hash = window.location.hash.toLowerCase();
          if (hash.startsWith('#history')) setCurrentPage('history');
          else setCurrentPage('home');
        }
        handleHash();
        window.addEventListener('hashchange', handleHash);
        return () => window.removeEventListener('hashchange', handleHash);
      }, []);

      const handleNavigate = useCallback((page, hash = '') => {
        if (page === 'history') {
          setCurrentPage('history');
          window.location.hash = '#history';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          setCurrentPage('home');
          if (hash) {
            window.location.hash = hash;
            setTimeout(() => {
              const el = document.querySelector(hash);
              if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                el.classList.add('ring-4', 'ring-brand-pale', 'transition-all', 'duration-500');
                setTimeout(() => el.classList.remove('ring-4', 'ring-brand-pale'), 2000);
              }
            }, 80);
          } else {
            window.location.hash = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        }
      }, []);

      useEffect(() => {
        function handleKeyDown(e) {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            setIsSearchOpen(prev => !prev);
          } else if (e.key === '/' && !['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) {
            e.preventDefault();
            setIsSearchOpen(true);
          } else if (e.key === 'Escape') {
            setIsSearchOpen(false);
            setIsAnthemOpen(false);
          }
        }
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      return (
        <div className="min-h-screen flex flex-col bg-brand-white text-slate-800 font-sans selection:bg-brand-pale selection:text-brand-forest antialiased">
          <Navbar
            currentPage={currentPage}
            onNavigate={handleNavigate}
            onOpenSearch={() => setIsSearchOpen(true)}
            historyLang={historyLang}
            onChangeHistoryLang={setHistoryLang}
          />

          {/* Conditional Rendering between Pages with ZERO page reload */}
          {currentPage === 'home' && (
            <main className="flex-grow">
              <Hero onExploreHistory={() => handleNavigate('history')} />
              <Principles />
              <Performance />
              <Gallery />
              <Contact />
            </main>
          )}

          {currentPage === 'history' && (
            <main className="flex-grow py-10 sm:py-14">
              <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
                <HistoryTimeline lang={historyLang} />
                <LeadershipDirectory lang={historyLang} />
              </div>
            </main>
          )}

          <Footer
            onNavigate={handleNavigate}
            onOpenAnthem={() => setIsAnthemOpen(true)}
          />

          <SearchModal
            isOpen={isSearchOpen}
            onClose={() => setIsSearchOpen(false)}
            onNavigate={handleNavigate}
            onOpenAnthem={() => setIsAnthemOpen(true)}
          />

          <AnthemModal
            isOpen={isAnthemOpen}
            onClose={() => setIsAnthemOpen(false)}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
