  <!-- Theme Color for Browser Address Bar -->
  <meta name="theme-color" content="#196716" id="meta-theme-color">

  <!-- Instant System Dark Theme Pre-Detection (Zero-FOUC) -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('kcc_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = stored === 'dark' || ((!stored || stored === 'system') && prefersDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
          var meta = document.getElementById('meta-theme-color');
          if (meta) meta.setAttribute('content', '#0b120c');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    })();
  </script>
